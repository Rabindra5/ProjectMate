{% extends "base.html" %}{% block title %}FAQ | ProjectMate{% endblock %}{% block content %}<div class="container py-5"><h1>Frequently asked questions</h1><div class="accordion mt-4" id="faq">{% for question, answer in faqs %}<div class="accordion-item"><h2 class="accordion-header" id="heading-{{ forloop.counter }}"><button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#answer-{{ forloop.counter }}">{{ question }}</button></h2><div id="answer-{{ forloop.counter }}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" data-bs-parent="#faq"><div class="accordion-body">{{ answer }}</div></div></div>{% endfor %}</div></div>{% endblock %}
