<ul class="nav nav-pills team-tabs gap-2 mb-4" aria-label="Request views">
    <li class="nav-item">
        <a class="nav-link {% if active_tab == 'inbox' %}active{% endif %}"
           {% if active_tab == 'inbox' %}aria-current="page"{% endif %}
           href="{% url 'teams:request_inbox' %}">
            <i class="bi bi-inbox me-1" aria-hidden="true"></i>Received
            {% if pending_requests_count %}<span class="badge text-bg-warning ms-1">{{ pending_requests_count }}</span>{% endif %}
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if active_tab == 'sent' %}active{% endif %}"
           {% if active_tab == 'sent' %}aria-current="page"{% endif %}
           href="{% url 'teams:my_requests' %}">
            <i class="bi bi-send me-1" aria-hidden="true"></i>Sent
        </a>
    </li>
</ul>
