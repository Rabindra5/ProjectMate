{% extends "base.html" %}

{% block content %}
<style>
    .password-reset-wrapper {
        min-height: 65vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 16px;
    }

    .password-reset-card {
        width: 100%;
        max-width: 480px;
        padding: 36px;
        border: 1px solid var(--bs-border-color, #e5e7eb);
        border-radius: 20px;
        background: var(--bs-body-bg, #ffffff);
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.06);
    }

    .reset-icon {
        width: 72px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        border-radius: 20px;
        background: rgba(var(--bs-primary-rgb, 79, 70, 229), 0.10);
        color: var(--bs-primary, #4f46e5);
    }

    .reset-icon svg {
        width: 32px;
        height: 32px;
    }

    .reset-icon-success {
        background: #dcfce7;
        color: #15803d;
    }

    .reset-icon-danger {
        background: #fee2e2;
        color: #dc2626;
    }

    .reset-heading {
        font-size: 1.65rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 12px;
    }

    .reset-description {
        font-size: 0.95rem;
        line-height: 1.7;
    }

    .reset-notice {
        background: var(--bs-tertiary-bg, #f8fafc);
        border: 1px solid var(--bs-border-color, #e5e7eb);
        border-radius: 12px;
        padding: 16px;
        font-size: 0.875rem;
        line-height: 1.6;
    }

    .password-reset-card .form-control {
        min-height: 46px;
        border-radius: 10px;
    }

    .password-reset-card .btn {
        min-height: 46px;
        border-radius: 10px;
        font-weight: 600;
    }

    .reset-footer {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--bs-border-color, #e5e7eb);
        text-align: center;
        font-size: 0.875rem;
    }

    .reset-footer a {
        text-decoration: none;
        font-weight: 500;
    }

    .reset-footer a:hover {
        text-decoration: underline;
    }

    @media (max-width: 576px) {
        .password-reset-wrapper {
            padding: 32px 12px;
        }

        .password-reset-card {
            padding: 24px;
            border-radius: 16px;
        }

        .reset-heading {
            font-size: 1.45rem;
        }
    }
</style>

<div class="container">
    <div class="password-reset-wrapper">
        <section class="password-reset-card">
            {% block reset_content %}{% endblock %}
        </section>
    </div>
</div>

<script>
    // Handle password visibility across all authentication pages.
    document.addEventListener("click", function (event) {
        const button = event.target.closest("[data-password-toggle]");

        if (!button) return;

        const input = document.getElementById(
            button.dataset.passwordToggle
        );

        if (!input) return;

        const showPassword = input.type === "password";

        input.type = showPassword ? "text" : "password";
        button.textContent = showPassword
            ? "Hide password"
            : "Show password";

        button.setAttribute("aria-pressed", String(showPassword));
    });
</script>

{% block reset_scripts %}{% endblock %}
{% endblock %}
